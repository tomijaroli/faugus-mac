# Nested config for tests: asserting an exact empty string is the point of many expectations, and
# fixtures (VDF, shell snippets) carry long literal lines.
disabled_rules:
  - empty_string
line_length:
  warning: 140
  error: 220
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true
function_body_length:
  warning: 150
  error: 300
