name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    env:
      # Pinned so CI compiles with the same major toolchain as development (Xcode 26, Swift 6.2).
      # Xcode 16.4 is the runner default and rejects code that Xcode 26 accepts. When bumping,
      # pick a version from the runner image list (actions/runner-images, macos-15-arm64-Readme).
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Tools
        run: brew install xcodegen gettext swiftlint swiftformat
      - name: Style (SwiftFormat and SwiftLint)
        run: |
          swiftformat --version
          swiftlint version
          swiftformat . --lint
          swiftlint lint --strict
      - name: Upstream fixtures are up to date
        run: |
          python3 Tools/gen-fixtures/gen.py
          git diff --exit-code Packages/FaugusCore/Tests
      - name: FaugusCore tests
        run: swift test
        working-directory: Packages/FaugusCore
      - name: Build app
        run: |
          xcodegen generate
          xcodebuild -project FaugusForMac.xcodeproj -scheme Faugus -configuration Debug \
            -derivedDataPath build build
