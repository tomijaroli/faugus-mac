# SwiftLint. Layout is SwiftFormat's job (.swiftformat); this file checks the rest of the Swift
# API Design Guidelines and common Swift conventions.

included:
  - App
  - Packages/FaugusCore/Sources
  - Packages/FaugusCore/Tests

excluded:
  - upstream
  - build
  - .build
  - .swiftpm
  - DerivedData
  - dist
  - TestPrograms
  - "**/.build"

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - lower_acl_than_parent
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  # Owned by SwiftFormat: it removes/adds these itself, so linting them would only fight it.
  - trailing_comma
  - opening_brace
  - statement_position
  - trailing_closure
  - multiple_closures_with_trailing_closure
  # Modifier order is fixed by SwiftFormat (`modifierOrder`).
  - modifier_order
  # Conflict with SwiftFormat's argument wrapping (it wraps every argument onto its own line).
  - multiline_arguments
  - multiline_parameters
  # `String(decoding:as:)` is deliberate for logs and child-process output: lossy beats failing.
  - optional_data_string_conversion
  # Tri-state values (unset / true / false) are part of the upstream JSON model.
  - discouraged_optional_boolean

line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

file_length:
  warning: 800
  error: 1500

type_body_length:
  warning: 400
  error: 800

function_body_length:
  warning: 100
  error: 250

cyclomatic_complexity:
  warning: 20
  error: 40

nesting:
  type_level: 3

identifier_name:
  # Short locals (`o`, `d`, `f`, `c`) are common in small scopes and in tests; the rule still
  # enforces lowerCamelCase and a maximum length.
  min_length:
    warning: 1
  max_length:
    warning: 50

type_name:
  min_length: 3
  max_length: 50

large_tuple:
  warning: 4
  error: 6

# Swift API Design Guidelines: force unwraps and `try!` are errors in app code; tests may use them.
force_try: error
force_cast: error

custom_rules:
  no_print_in_sources:
    name: "No print in sources"
    regex: '^\s*print\('
    included: "(App|Packages/FaugusCore/Sources)/.*\\.swift"
    match_kinds: [identifier]
    message: "Log through FaugusLog (or write to stderr in a CLI path) instead of print()."
    severity: warning
